name: Cartrawler
description: >-
  CarTrawler is a leading B2B technology provider of car rental, ground transport and insurtech
  solutions to the global travel industry. Through its Connect Platform it links airlines, online
  travel agencies and travel companies to a worldwide marketplace of car rental suppliers, private
  transfers and ride-hailing partners, displaying millions of cars daily and processing billions of
  queries. CarTrawler serves 70+ airlines and 250+ travel companies worldwide (including American
  Airlines, Ryanair, easyJet, Qantas, Southwest, eDreamsODIGEO and Uber), differentiating through
  proprietary technology, real-time machine-learning pricing and personalized retailing. Integration
  is delivered through partner and supplier programs rather than a public self-service developer
  portal; this profile was surfaced as an Insight Partners portfolio company and enriched by the
  API Evangelist pipeline.
